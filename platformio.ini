; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = webserver

[env]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = yolo_uno
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit AHTX0

[env:webserver]
build_src_filter = +<main.cpp> +<mainserver.cpp> +<global.cpp>

[env:blink_dht2]
build_src_filter = +<blink_dht2.cpp>

[env:binary_semaphore]
build_src_filter = +<binary_semaphore.cpp>
